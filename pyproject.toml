[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voteworth"
version = "0.1.4"
description = "Measure how often two voters of an LLM judge panel or voter ensemble pick the same answer when both break from the plurality, report Kish's effective number of votes by raw agreement, and correct the vote for voters that do, naming the panel shape where it cannot. Closed-form, label-free, numpy only."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexander Bering" }]
keywords = [
    "llm",
    "llm-as-judge",
    "self-consistency",
    "ensemble",
    "majority-voting",
    "calibration",
    "overconfidence",
    "evaluation",
    # vocabulary the field actually searches on, measured from a prior-art sweep
    "correlated-errors",
    "error-correlation",
    "effective-sample-size",
    "design-effect",
    "conditional-independence",
    "dependence-aware-aggregation",
    "intra-model-bias",
    "judge-panel",
    "agreement-confidence",
    "cross-family-correlation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/zensation-ai/voteworth"
Author = "https://orcid.org/0009-0001-1793-012X"
Measurement = "https://doi.org/10.5281/zenodo.21775275"
Dataset = "https://doi.org/10.5281/zenodo.21773065"
Specification = "https://doi.org/10.5281/zenodo.22012189"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voteworth = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
