name: publish

# Publishes a GitHub release to PyPI with Trusted Publishing (OIDC). No token is stored
# anywhere: PyPI accepts the upload because it comes from this workflow, in this repository,
# in the environment named below. The PyPI side is a publisher for project "voteworth" with
# owner "zensation-ai", repository "voteworth", workflow "publish.yml", environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # v0.1.1 shipped with __version__ still at 0.1.0, because only pyproject.toml was raised.
      # A release now stops unless the tag, the metadata, the code and CITATION.cff name the
      # same version.
      - name: Tag, pyproject.toml, __version__ and CITATION.cff must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/voteworth/__init__.py)
          cff=$(sed -n 's/^version: //p' CITATION.cff)
          echo "tag=$tag pyproject=$meta __version__=$code CITATION.cff=$cff"
          test "$tag" = "$meta" && test "$meta" = "$code" && test "$code" = "$cff"

      # date-released stands as a placeholder in review and is set on the day of the release.
      # published_at is UTC: a release published between 00:00 and 01:00 CET carries the day
      # before and stops here, which errs on the safe side.
      - name: CITATION.cff date-released must be the day the release was published
        env:
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          released=$(sed -n 's/^date-released: //p' CITATION.cff)
          echo "date-released=$released published_at=$PUBLISHED_AT"
          test "$released" = "${PUBLISHED_AT%%T*}"

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/voteworth/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
