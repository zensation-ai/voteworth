name: publish

# Publishes a GitHub release to PyPI with Trusted Publishing (OIDC). No token is stored
# anywhere: PyPI accepts the upload because it comes from this workflow, in this repository,
# in the environment named below. The PyPI side is a publisher for project "voteworth" with
# owner "zensation-ai", repository "voteworth", workflow "publish.yml", environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # v0.1.1 shipped with __version__ still at 0.1.0, because only pyproject.toml was raised.
      # A release now stops unless the tag, the metadata and the code name the same version.
      - name: Tag, pyproject.toml and __version__ must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          meta=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/voteworth/__init__.py)
          echo "tag=$tag pyproject=$meta __version__=$code"
          test "$tag" = "$meta" && test "$meta" = "$code"

      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/voteworth/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
